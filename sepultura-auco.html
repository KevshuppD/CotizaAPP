<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización Sepultura Parque Auco</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .mode-btn {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid var(--primary-green);
            border-radius: 25px;
            background: #ffffff;
            color: #168053;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .mode-btn:hover {
            background: #eef9f3;
        }
        .mode-btn.active {
            background: var(--primary-green);
            color: #ffffff;
            border-color: var(--primary-green);
            box-shadow: 0 3px 10px rgba(35, 194, 126, 0.35);
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="btn" onclick="exportAsImage()">Descargar Imagen</button>
        <button class="btn btn-share" onclick="shareAsImage()">Compartir Imagen</button>
        <button class="btn btn-pdf" onclick="shareAsPDF()">Compartir PDF</button>
    </div>

    <div class="container" id="capture-area">
        <div class="header-title-container">
            <div class="title-logo-wrapper">
                <h1 id="main-title">Cotización Sepultura Parque Auco</h1>
                <img src="logo-parque.png" alt="Logo" class="park-logo" onerror="this.style.display='none'">
            </div>
            <div id="park-name-display" class="park-display">PARQUE AUCO</div>
        </div>

        <div class="product-selector-container no-export">
            <label for="product-type" style="font-weight: bold; margin-right: 10px;">Tipo de Producto:</label>
            <select id="product-type" class="park-select" style="width: auto; padding: 5px 10px;">
                <option value="sepultacion">Derecho de Sepultación Anticipada</option>
                <option value="sepultura-auco" selected>Sepultura Parque Auco</option>
                <option value="jardin-auco">Jardín Familiar Parque Auco</option>
                <option value="fuente-auco">Fuente de Auco</option>
                <option value="cremacion">Cremación</option>
                <option value="aumento-capacidad">Aumento de Capacidad</option>
                <option value="mantencion">Mantención Perpetua</option>
                <option value="servicios-funerarios">Servicios Funerarios</option>
            </select>
        </div>

        <!-- SELECTOR DE MODALIDAD DE FINANCIAMIENTO -->
        <div class="mode-selector-container no-export" style="margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: #f8faf9; padding: 10px 16px; border-radius: 30px; border: 1px solid #e0e8e3;">
            <button type="button" class="mode-btn active" data-mode="uf" id="btn-mode-uf">
                <span>🔹</span> Financiamiento UF (0,55%)
            </button>
            <button type="button" class="mode-btn" data-mode="pesos" id="btn-mode-pesos">
                <span>💵</span> Financiamiento Pesos ($)
            </button>
            <button type="button" class="mode-btn" data-mode="contado" id="btn-mode-contado">
                <span>⚡</span> Cuota Contado / Sin Interés
            </button>
        </div>

        <div class="section-header">
            <div class="left-col" style="flex: 1 1 54%;">
                <div id="sepultacion-fields">
                    <table style="width: 100%;">
                        <thead>
                            <tr>
                                <th style="width: 40%; text-align: left; background: #e8e8e8;">Concepto</th>
                                <th class="bold uf-col" style="background: #e8e8e8; text-align: center;">UF</th>
                                <th class="bold clp-col" style="background: #e8e8e8; text-align: center;">$</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td id="label-valor-real" class="bold">Valor Real</td>
                                <td class="uf-col">
                                    <input type="number" id="ref-uf-input" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="ref-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                            <tr id="discount-row-main">
                                <td class="bold">
                                    <div style="display: flex; align-items: center; justify-content: space-between;">
                                        <span>Descuento</span>
                                        <div style="display: inline-flex; align-items: center; gap: 2px;">
                                            <input type="number" id="porcentaje-descuento-main" class="input-inline editable-field" value="" placeholder="0" min="0" max="100" step="any" style="width: 46px; text-align: center; padding: 2px 4px; font-size: 12px; font-weight: bold;">
                                            <span style="font-size: 12px; font-weight: bold;">%</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="uf-col">
                                    <input type="number" id="descuento-uf-input" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="descuento-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                            <tr id="capital-anterior-row">
                                <td class="bold">Capital Anterior</td>
                                <td class="uf-col">
                                    <input type="number" id="capital-anterior-uf-input" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="capital-anterior-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td id="label-valor-ni" class="bold">Valor Promocional</td>
                                <td class="uf-col">
                                    <input type="number" id="valor-ni-uf" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col yellow-bg">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="valor-ni-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td class="bold">
                                    <div style="display: flex; align-items: center; justify-content: space-between;">
                                        <span>Pie</span>
                                        <div style="display: inline-flex; align-items: center; gap: 2px;">
                                            <input type="number" id="pie-percent" class="input-inline editable-field" value="10" min="0" max="100" step="any" style="width: 46px; text-align: center; padding: 2px 4px; font-size: 12px; font-weight: bold;">
                                            <span style="font-size: 12px; font-weight: bold;">%</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="uf-col">
                                    <input type="number" id="pie-uf" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col yellow-bg">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="pie-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                            <tr id="saldo-financiar-row">
                                <td class="bold">Saldo a Financiar</td>
                                <td class="uf-col gray-bg">
                                    <input type="number" id="saldo-financiar-uf-input" class="input-inline editable-field" value="" placeholder="0.00" step="0.01">
                                </td>
                                <td class="clp-col">
                                    <div class="currency-input-wrapper">
                                        <input type="text" id="saldo-financiar-clp-input" class="input-inline editable-field" value="" placeholder="$0">
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div id="sepultura-cuotas-container" style="margin-top: 15px;">
                        <!-- SELECTOR DE CUOTAS A MOSTRAR -->
                        <div class="cuotas-filter-container no-export" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; background: #f0f7f3; padding: 6px 12px; border-radius: 6px; border: 1px solid #cce5d6;">
                            <span class="bold" style="font-size: 12px; color: #168053; text-transform: uppercase;">
                                Cuotas a mostrar:
                            </span>
                            <div id="plazos-checkboxes-container" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                                <!-- Checkboxes generados dinámicamente según modalidad -->
                            </div>
                        </div>

                        <div class="cuotas table-responsive" style="margin-top: 6px;">
                            <table style="width: 100%;">
                                <thead>
                                    <tr id="cuotas-header-row">
                                        <!-- Generado dinámicamente según la modalidad activa -->
                                    </tr>
                                </thead>
                                <tbody id="sepultura-cuotas-body">
                                    <!-- Generado dinámicamente -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-col" style="flex: 1 1 43%;">
                <table style="margin-bottom: 20px;">
                    <tr>
                        <td class="bold">FECHA</td>
                        <td id="current-date" style="text-align: right;">--/--/----</td>
                    </tr>
                    <tr>
                        <td class="bold">UF HOY</td>
                        <td style="text-align: right; font-weight: bold;">
                            <div class="currency-input-wrapper">
                                <span>$</span>
                                <input type="number" id="uf-value-input" class="input-inline editable-field" value="40844.79" step="0.01">
                            </div>
                        </td>
                    </tr>
                </table>

                <div id="sepultacion-output">
                    <div style="border: 1px solid black; margin-bottom: 10px; border-radius: 4px; background: #fff;">
                        <div class="quantity-box" style="display: flex; justify-content: space-between; align-items: center; border: none; padding: 8px 12px; border-bottom: 1px solid #eee;">
                            <span style="font-weight: bold;">Capacidad</span>
                            <select id="capacidad-select" style="font-weight: bold; font-size: 14px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer;">
                                <option value="1">Capacidad 1</option>
                                <option value="2">Capacidad 2</option>
                                <option value="3">Capacidad 3</option>
                                <option value="4" selected>Capacidad 4</option>
                                <option value="6">Capacidad 6</option>
                                <option value="8">Capacidad 8</option>
                            </select>
                        </div>
                        <div class="quantity-box" style="display: flex; justify-content: space-between; align-items: center; border: none; padding: 8px 12px; background: #fafafa;">
                            <span style="font-weight: bold; color: #168053;">Reducciones</span>
                            <span id="reducciones-display" style="font-weight: bold; font-size: 14px; color: #168053; background: #eef9f3; padding: 3px 10px; border-radius: 4px; border: 1px solid #23C27E;">
                                4 Reducciones
                            </span>
                        </div>
                    </div>

                    <div style="border: 1px solid black; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fff;">
                        <div style="font-weight: bold; font-size: 13px; margin-bottom: 5px; color: #333;">Beneficios</div>
                        <div id="beneficios-text" class="editable-textarea-mimic" contenteditable="true" placeholder="Escribir beneficios aquí..."></div>
                    </div>

                    <div id="sepultacion-graphic-container" style="margin-top: 15px; display: flex; justify-content: center; min-height: 150px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/products/sepultura-auco.js"></script>
</body>
</html>
